# `${{ toJSON(secrets) }}` is the canonical Actions secret-dump primitive: it serialises EVERY
# secret at once, and a following step can re-encode the result to defeat log masking. Matching
# only `secrets.NAME` / `secrets['NAME']` caught the mild case and missed the severe one.
name: whole secrets context
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - run: echo '${{ toJSON(secrets) }}' | base64
  clean:
    runs-on: ubuntu-latest
    steps:
      - run: echo "the word secrets in prose is not a reference"
      - run: echo '${{ github.event_name }}'
