# REGRESSION FIXTURE: `secrets: inherit` is invisible to a scalar walk.
#
# A caller job that passes `secrets: inherit` hands the callee EVERY secret the caller holds, while
# containing no `secrets.*` expression anywhere — and it has no `steps:` either, so before the fix
# the whole caller/callee pair produced not one finding.
#
# Both jobs below are byte-identical apart from the `secrets:` key. That is the point: the negative
# control proves the rule keys on `inherit` specifically and has not become "any reusable call".
name: violating secrets inherit
on:
  pull_request:
permissions:
  contents: read
jobs:
  # VIOLATES secrets-in-pr-reachable — no `secrets.` text anywhere in this job.
  inherits:
    uses: ./.github/workflows/secrets-inherit-callee.yml
    secrets: inherit

  # NEGATIVE CONTROL — same reusable call, no secrets passed. Must produce no finding.
  no-inherit:
    uses: ./.github/workflows/secrets-inherit-callee.yml
