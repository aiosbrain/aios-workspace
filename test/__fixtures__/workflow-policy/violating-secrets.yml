# VIOLATES secrets-in-pr-reachable — a durable credential in a pull_request job.
name: violating secrets
on:
  pull_request:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    steps:
      - run: echo "$DEPLOY_TOKEN" | head -c 0
