# The shape aios-team-brain/pr-task-link.yml and aios-workspace/pr-in-review.yml land as: a
# pull_request_target job that legitimately needs a credential, delivered via an `environment:`.
#
# `environment:` is a BLAST-RADIUS control, not an AUTHOR-TRUST control. A fork PR still receives
# the secret, because pull_request_target always resolves the base ref, so any author trivially
# satisfies a `main`-only deployment branch policy. The gate therefore does NOT treat the presence
# of `environment:` as satisfying or waiving `secrets-in-pr-reachable` — that waiver has to be
# written down, owned, and justified in the allowlist.
#
# This fixture deliberately violates FOUR rules at once so the test can prove that waiving the
# secrets rule for this job leaves the other three enforced against the very same job.
name: violating prt environment secret
on:
  pull_request_target:
    types: [opened, reopened]
permissions:
  contents: read
jobs:
  link:
    runs-on: ubuntu-latest
    environment: pr-automation
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
    steps:
      # mutable-action-ref AND pr-target-checkout, in one step.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # pr-target-dynamic-run.
      - run: echo "linking ${{ github.event.pull_request.title }}"
