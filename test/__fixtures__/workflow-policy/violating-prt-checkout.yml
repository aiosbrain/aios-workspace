# VIOLATES pr-target-checkout — pull_request_target checking out the PR head.
name: violating prt checkout
on:
  pull_request_target:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: echo reviewed
