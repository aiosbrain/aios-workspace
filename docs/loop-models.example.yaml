# loop-models.example.yaml — per-step model config for the agent relay (plan/build/ship).
#
# Copy to .aios/loop-models.yaml (gitignored) and tune. Flat keys only (see flat-yaml.mjs).
#
# MODEL REF SYNTAX (runtime-agnostic):
#   <provider>:<modelId>   explicit routing
#   vendor/model             OpenRouter (when no prefix)
#   bare id                  inferred (deepseek* → DeepSeek API, claude* → Claude CLI, glm* → OpenCode, …)
#
# Providers:
#   claude     Claude Code CLI (agentic: plan/build/fix)
#   cursor     Cursor agent CLI (agentic or prompt)
#   opencode   OpenCode Go API (prompt) or `opencode run` (agentic)
#   codex      Codex CLI (agentic or prompt; approved tiers: gpt-5.6-sol|gpt-5.6-terra|gpt-5.6-luna)
#   deepseek   DeepSeek direct API (prompt)
#   openrouter OpenRouter API (prompt)
#
# DIVERSITY GUARD: build≠code_review family, plan≠plan_review family (fail closed).
# AGENTIC GUARD: plan/build/fix/fix_escalated need claude|cursor|opencode|codex — not openrouter/deepseek alone.
#
# REVIEWER PRESETS (runtime-agnostic shortcuts for review-style prompt steps — plan_review,
# code_review, spec_eval): `<step>_preset: <name>` instead of memorizing provider syntax.
# `billing` says how it's actually paid for — `subscription` presets run through a locally
# logged-in CLI (Claude Code / Codex) and are billed against that subscription, never metered
# API credits; `api` presets are metered by the named API key.
#   deepseek            api            deepseek:deepseek-v4-pro   (DEEPSEEK_API_KEY)      — current default
#   claude-subscription subscription   claude:fable-5              (claude CLI login)
#   codex-subscription  subscription   codex:gpt-5.6-terra        (codex CLI login)
#   opencode-glm        api            opencode:glm-5.2           (OPENCODE_API_KEY)
#   openrouter-gpt       api           openrouter:openai/gpt-5.5  (OPENROUTER_API_KEY)
# A preset is just sugar for the equivalent `<step>_model:` ref — it still flows through the
# same diversity/agentic guards. A Claude-family preset (claude-subscription) on spec_eval
# needs spec_author/spec_fix moved off Claude too, or the diversity guard aborts — see the
# spec_eval example below.

# recon_model: claude:claude-haiku-4-5
# plan_model: claude:claude-opus-4-8
# plan_effort: xhigh
# plan_review_model: opencode:glm-5.2
# plan_review_model: opencode:kimi-k2.7-code
# plan_review_model: openrouter:moonshotai/kimi-k2.5
# plan_review_model: deepseek:deepseek-v4-pro

# build_model: claude:claude-sonnet-5
# build_effort: high
# build_model: opencode:glm-5.2
# build_model: codex:gpt-5.6-sol
# code_review_model: deepseek:deepseek-v4-pro
# code_review_model: openrouter:deepseek/deepseek-chat
# code_review_timeout_s: 300

# fix_model: claude:claude-sonnet-5
# fix_effort: medium
# fix_escalated_model: claude:claude-opus-4-8
# fix_escalated_effort: high

# consolidate_model: claude:claude-haiku-4-5
# consolidate_model: openrouter:openai/gpt-4o-mini
# safety_review_model: claude:claude-opus-4-8
# orchestrate_model: claude:fable-5
# digest_model: claude:claude-haiku-4-5

# spec_eval_model: deepseek:deepseek-v4-pro
# spec_author_model: claude:claude-opus-4-8
# spec_author_effort: high
# spec_fix_model: claude:claude-opus-4-8
# spec_fix_effort: high
# spec_eval_preset: codex-subscription      # Requires aios-devtools 0.2.1+; Codex CLI subscription
#                                            # instead of DEEPSEEK_API_KEY;
#                                            # openai family stays cross-family from Opus spec_author
# Or: spec_eval_preset: claude-subscription  # Fable via Claude CLI; move spec_author/spec_fix
#                                            # off Claude too (e.g. codex:gpt-5.6-terra) to keep
#                                            # the author/evaluator diversity guard satisfied.
# decisions_distill_model: claude:claude-opus-4-8
