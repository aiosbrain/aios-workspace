version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-dependencies:
        dependency-type: "development"
      prod-dependencies:
        dependency-type: "production"
    ignore:
      # eslint 10 was blocked by eslint-plugin-react peer-capping at eslint ^9.7. That
      # plugin left with gui/client in the AIO-612 cut, so THIS CONSTRAINT NO LONGER
      # APPLIES — the ignore is kept only so a major eslint bump is a deliberate PR
      # rather than a weekly one. Remove it when someone actually does that upgrade.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # typescript 7 (the native compiler) is blocked by typescript-eslint 8.67.0, whose
      # peer range is `>=4.8.4 <6.1.0`. Dependabot proposed 5.9.3 -> 7.0.2 in PR #607 and
      # produced an unresolvable lockfile: `npm ci` died with ERESOLVE, and because every
      # CI job installs first, EVERY lane went red. Remove this ignore once typescript-eslint
      # widens that peer range to admit TS 7. Note the range DOES admit typescript 6.0.x, so
      # a 6.x hop is available today as its own deliberate PR.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
