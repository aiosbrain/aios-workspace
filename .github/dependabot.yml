version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-dependencies:
        dependency-type: "development"
      prod-dependencies:
        dependency-type: "production"
    ignore:
      # eslint 10 blocked upstream: eslint-plugin-react (latest 7.37.5) peer-caps at
      # eslint ^9.7 and our flat config uses react.configs.flat.recommended. Revisit
      # when eslint-plugin-react ships eslint 10 support. (AIO-321)
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # Carried over from the removed "/gui/client" updater, which was the only place
      # this constraint lived. gui/client is an npm workspace, so the root updater now
      # proposes its bumps too — and without this the grouped dev-dependencies PR can
      # drag @vitejs/plugin-react past the repo's vite ^6 constraint.
      # @vitejs/plugin-react 6 requires vite ^8, but gui/client is on vite ^6.
      # Landing it means a vite 6→8 migration — out of scope for weekly bumps.
      # Revisit alongside a deliberate vite 8 upgrade. (AIO-321)
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
