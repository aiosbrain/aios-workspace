name: MCP host installation safety
on:
  pull_request:
    paths:
      - scripts/mcp-host*.mjs
      - scripts/mcp-credentials.mjs
      - test/mcp-host*.test.mjs
      - test/lib/mcp-host-fixture.mjs
      - package.json
      - package-lock.json
      - .github/workflows/mcp-host-install.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapters:
    name: MCP installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node --test test/mcp-host-install.test.mjs test/mcp-host-atomic.test.mjs
