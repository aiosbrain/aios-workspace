name: MCP host installation safety
on:
  pull_request:
    paths:
      - scripts/mcp-*.mjs
      - scripts/brain-mcp.mjs
      - scripts/brain-client.mjs
      - scripts/flat-yaml.mjs
      - scripts/distribution-root.mjs
      - scripts/user-config-reader.mjs
      - scripts/command-errors.mjs
      - scripts/cli/config-broker.mjs
      - scripts/cli/errors.mjs
      - packages/mcp-build/**
      - packages/mcp/**
      - packages/mcp-core/**
      - packages/foundation/src/**
      - scripts/cli/registry.mjs
      - scripts/onboard-command.mjs
      - scripts/onboard-inspect.mjs
      - scripts/mcp-credentials.mjs
      - test/mcp-host*.test.mjs
      - test/mcp-profile*.test.mjs
      - test/mcp-credentials.test.mjs
      - test/lib/mcp-host-fixture.mjs
      - package.json
      - package-lock.json
      - .github/workflows/mcp-host-install.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapters:
    name: MCP installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      # Windows ACL fixtures launch PowerShell repeatedly. Avoid competing test-file
      # workers exhausting the published server's bounded credential-probe startup.
      - name: Run native installer and profile lifecycle safety tests
        run: >
          node --test --test-concurrency=1
          test/mcp-host-install.test.mjs test/mcp-host-atomic.test.mjs
          test/mcp-host-verify.test.mjs test/mcp-host-cli.test.mjs
          test/mcp-credentials.test.mjs test/mcp-profile-migration.test.mjs
          test/mcp-profile-binding.test.mjs test/mcp-profile-lifecycle.test.mjs
          test/mcp-profile-artifact.test.mjs
