name: PR → Linear In Review

# Deterministic PM hygiene: when a PR opens (or is reopened / marked ready), move the Linear
# issue(s) it references to "In Review" — so an agent or human never has to remember to do it by
# hand, and the board reflects reality every single time.
#
# Why direct-to-Linear and not the brain rail: the brain's task-status model is
# backlog|ready|in_progress|blocked|done — it does NOT model "in review", and the work-events
# endpoint forces status=done. "In Review" is a transient PR-lifecycle state the brain doesn't own,
# so projecting it straight to Linear doesn't fight the brain; the merge → work-event → done
# projection (aios-work-sync.yml) cleanly supersedes it. If the brain later models an in-review
# status, move this onto the work-events rail (see the follow-up note in the PR that added this).
#
# Advisory by construction: soft-skips when LINEAR_API_KEY is unset and never fails the PR on a
# Linear hiccup — it must never block a merge.
#
# ── Credential isolation (why this is pull_request_target) ───────────────────────────────────
# Under `pull_request` GitHub takes the WORKFLOW FILE ITSELF from the pull request's head, so any
# same-repo branch PR could rewrite this file to print or POST LINEAR_API_KEY before a human ever
# looked at the diff. `pull_request_target` runs the base branch's copy of this file instead, so
# every line executed here is trusted, reviewed, merged code.
#
# The rules that make that trigger safe, all of which this file obeys:
#   1. Nothing from the PR head is checked out, fetched, installed, built, or executed. There is
#      no `actions/checkout`, no `npm install`, no script from the candidate tree. The only code
#      that runs is the inline Node program below, which lives on the base branch.
#   2. Every attacker-controlled field (title, body, branch name) is handed to that program
#      through `env:`, never interpolated with `${{ }}` into a `run:` script body — so a PR title
#      containing shell or template syntax is inert data, not code.
#   3. The job is scoped to same-repository pull requests. Under `pull_request` a fork PR received
#      no secrets and this workflow silently no-op'd; `pull_request_target` would hand a fork run
#      the key instead. The guard keeps today's behaviour and keeps the credential out of any run
#      an outside contributor can start.
#   4. `permissions:` is read-only. No `statuses: write`, no `checks: write`: this workflow must
#      never be able to author a merge-gating signal.
#
# What the `trusted-automation` Environment does and does not do. Its deployment branch policy is
# evaluated against GITHUB_REF, which under `pull_request_target` is the PR's BASE branch. So once
# LINEAR_API_KEY lives only on that environment it denies a `pull_request` run (ref is
# `refs/pull/<n>/merge`) and a run whose base is some side branch a collaborator pushed — but it
# does NOT deny a fork PR into `main`, because that run's ref is `refs/heads/main` like any other.
# Verified empirically. Treat it as a blast-radius control over WHICH workflows here may read the
# key, not as a control over WHO may trigger them; points 1-3 above are the actual protection.
# There are no third-party actions to pin here; if one is ever added it must be pinned by full
# commit SHA.

on:
  pull_request_target:
    # Restricted to PRs into `main` for the same reason as the other pull_request_target
    # workflows here: the "base" of a pull_request_target run is the PR's target branch, so an
    # unfiltered trigger lets a collaborator run this job in the context of a branch they
    # control. This job checks nothing out, but the filter keeps the trigger surface uniform.
    types: [opened, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

jobs:
  in-review:
    name: Move referenced Linear issue(s) to In Review
    # Same-repo PRs only — see point 3 in the header. A fork PR skips the job entirely, so no run
    # an outside contributor can start ever has the credential in scope.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Enrols this job as one of the few permitted to read LINEAR_API_KEY once the key lives only
    # on the environment. Environment secrets fall back to repo secrets, so this changes nothing
    # until the repo-level copy is deleted.
    environment: trusted-automation
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
    steps:
      - name: Transition referenced issues
        env:
          # Attacker-controlled PR metadata, passed as data. Never inlined into the script body.
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HTML_URL: ${{ github.event.pull_request.html_url }}
        run: |
          node <<'NODE'
          const key = process.env.LINEAR_API_KEY;
          if (!key) {
            // Only reachable when the value has genuinely not been entered yet. A mismatched
            // environment branch policy does NOT land here — it fails the job loudly before any
            // step runs ("Branch ... is not allowed to deploy to trusted-automation"), so this
            // soft-skip cannot mask a misconfigured environment.
            console.log("::notice title=Linear In Review skipped::LINEAR_API_KEY is not configured — set it on the `trusted-automation` environment to auto-move PR'd issues to In Review.");
            process.exit(0);
          }

          // The event payload is read only through these env vars — the workflow no longer parses
          // GITHUB_EVENT_PATH, so the exact set of PR fields this job trusts is visible above.
          const pr = {
            draft: process.env.PR_DRAFT === "true",
            title: process.env.PR_TITLE || "",
            body: process.env.PR_BODY || "",
            headRef: process.env.PR_HEAD_REF || "",
            html_url: process.env.PR_HTML_URL || "",
          };
          if (pr.draft) {
            console.log("::notice title=Draft PR skipped::Draft PRs are not moved to In Review until ready_for_review fires.");
            process.exit(0);
          }
          // Deliberately NOT the whole PR body: a body freely mentions other issues as evidence,
          // history, or "see also" — e.g. this very workflow's own fix PR described the bug by
          // pointing at PRs referencing other AIO-<n> identifiers, and the (now-working) lookup
          // moved/commented on THOSE issues too on the live run. Title + branch are where a PR is
          // actually tied to its own issue (the documented convention: "put `(AIO-130)` in the
          // title"); the body only counts for an EXPLICIT "Closes/Fixes/Resolves AIO-<n>" link,
          // same convention GitHub itself uses for closing keywords.
          const titleAndBranch = [pr.title, pr.headRef].join("\n");
          const bodyNoComments = pr.body.replace(/<!--[\s\S]*?-->/g, " ");
          const explicitBodyRefs = [
            ...bodyNoComments.matchAll(/\b(?:closes?|fixes?|resolves?)\s*:?\s*(AIO-\d+)/gi),
          ].map((m) => m[1].toUpperCase());
          const text = [titleAndBranch, ...explicitBodyRefs].join("\n");

          // Same matcher the other workflows use, then keep only this repo's Linear identifiers
          // (AIO-130). Bare brain row_keys (W2.5.8) and other Linear teams aren't owned by this
          // workflow; log and skip here.
          const re = /\b(?:AIOS-Work:\s*)?([A-Z][A-Z0-9]+-\d+|[A-Z]\d+(?:\.\d+)*)\b/g;
          const all = [...new Set([...text.matchAll(re)].map((m) => m[1]))];
          const idents = all.filter((k) => /^AIO-\d+$/.test(k));
          const skipped = all.filter((k) => !idents.includes(k));
          if (skipped.length) console.log(`Not Linear identifiers (skipped here; merge-sync handles them): ${skipped.join(", ")}`);
          if (!idents.length) {
            console.log("::notice title=No Linear issue referenced::PR references no AIO-<n> identifier in its title/body/branch — nothing to move. Add e.g. `(AIO-130)` to the title.");
            process.exit(0);
          }

          // `node <<NODE` runs as CommonJS — no top-level await — so the awaited work lives in an
          // async IIFE (matching the .then()-style the other inline workflow scripts use).
          const API = "https://api.linear.app/graphql";
          const gql = async (query, variables) => {
            const r = await fetch(API, {
              method: "POST",
              headers: { Authorization: key, "Content-Type": "application/json" },
              body: JSON.stringify({ query, variables }),
            });
            const j = await r.json().catch(() => null);
            if (!j || j.errors) throw new Error(j?.errors?.map((e) => e.message).join("; ") || `HTTP ${r.status}`);
            return j.data;
          };

          const stateCache = new Map();
          async function inReviewState(teamKey) {
            if (stateCache.has(teamKey)) return stateCache.get(teamKey);
            const d = await gql(
              `query($k:String!){ workflowStates(filter:{ team:{ key:{ eq:$k } } }){ nodes{ id name type } } }`,
              { k: teamKey }
            );
            const nodes = d.workflowStates.nodes;
            const norm = (s) => s.toLowerCase().replace(/\s+/g, " ").trim();
            const started = nodes.filter((s) => s.type === "started");
            const st =
              started.find((s) => norm(s.name) === "in review") ||
              started.find((s) => norm(s.name).includes("review"));
            stateCache.set(teamKey, st || null);
            return st || null;
          }

          async function findIssue(ident) {
            // `identifier` is not a filterable field on Linear's `IssueFilter` type (confirmed:
            // this used to silently no-op every run — GraphQL rejected the filter with
            // `Field "identifier" is not defined by type "IssueFilter"`, and the caller only
            // logged it as an advisory warning, so it never blocked the PR check either). The
            // singular `issue(id:)` query accepts a human-readable identifier (e.g. "AIO-130")
            // directly, verified live against the API — no team-scoped list-and-filter needed.
            try {
              const d = await gql(`query($id:String!){ issue(id:$id){ id identifier state{ id name } } }`, {
                id: ident,
              });
              return d.issue || null;
            } catch (e) {
              if (/not found/i.test(e.message)) return null;
              throw e;
            }
          }

          async function ensurePrComment(issueId, targetName) {
            const body = `PR opened → tracking in **${targetName}**: ${pr.html_url}`;
            const d = await gql(
              `query($id:String!){ issue(id:$id){ comments(first:50){ nodes{ body } } } }`,
              { id: issueId }
            );
            const comments = d.issue?.comments?.nodes || [];
            if (comments.some((comment) => comment.body?.includes(pr.html_url))) return false;
            await gql(
              `mutation($id:String!,$b:String!){ commentCreate(input:{ issueId:$id, body:$b }){ success } }`,
              { id: issueId, b: body }
            );
            return true;
          }

          (async () => {
            let failures = 0;
            for (const ident of idents) {
              try {
                const teamKey = ident.split("-")[0];
                const issue = await findIssue(ident);
                if (!issue) { console.log(`${ident}: not found in team ${teamKey} — skipping`); continue; }
                const target = await inReviewState(teamKey);
                if (!target) { console.log(`${ident}: no "In Review" state on the team — skipping`); continue; }
                const alreadyInReview = issue.state?.id === target.id;
                if (!alreadyInReview) {
                  await gql(
                    `mutation($id:String!,$s:String!){ issueUpdate(id:$id, input:{ stateId:$s }){ success } }`,
                    { id: issue.id, s: target.id }
                  );
                }
                const commented = await ensurePrComment(issue.id, target.name);
                const transition = alreadyInReview ? `already ${target.name}` : `${issue.state?.name ?? "?"} → ${target.name}`;
                console.log(`${ident}: ${transition}${commented ? "; PR backlink added" : "; PR backlink already present"}`);
              } catch (e) {
                failures++;
                console.log(`::warning title=${ident} not moved::${e.message}`);
              }
            }
            // Advisory: log failures but never fail the PR check.
            if (failures) console.log(`${failures} issue(s) could not be moved (see warnings) — not blocking.`);
          })().catch((e) => console.log(`::warning title=Linear In Review error::${e.message}`));
          NODE
