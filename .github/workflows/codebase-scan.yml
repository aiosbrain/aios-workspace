name: trusted codebase scan

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: trusted-codebase-scan-${{ github.sha }}
  cancel-in-progress: false

jobs:
  scan:
    name: codebase readiness scan → brain
    if: github.repository == 'aiosbrain/aios-workspace'
    runs-on: ubuntu-latest
    # ci.yml permits 25 minutes for parallel coverage shards plus 20 minutes for merge.
    # This job allows that bounded producer window plus setup and scanner execution.
    timeout-minutes: 60
    environment: trusted-automation
    steps:
      # This workflow file and every executed script come from the already-merged main SHA.
      # The durable Brain credentials are passed only to the configuration probe and final upload;
      # checkout, artifact handling, package installation, and health computation cannot read them.
      - name: Check Brain configuration
        id: brain
        env:
          AIOS_API_KEY: ${{ secrets.AIOS_API_KEY }}
          BRAIN_URL: ${{ secrets.AIOS_BRAIN_URL }}
          AIOS_TEAM: ${{ secrets.AIOS_TEAM }}
        run: |
          if [[ -n "$AIOS_API_KEY" && -n "$BRAIN_URL" && -n "$AIOS_TEAM" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.brain.outputs.configured == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.brain.outputs.configured == 'true'
        with:
          node-version: "22"

      - name: Resolve this SHA's trusted CI coverage producer
        id: coverage
        if: steps.brain.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/resolve-coverage-artifact.mjs

      - name: Download the verified producer's coverage bundle
        if: steps.brain.outputs.configured == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.coverage.outputs.run-id }}
          name: coverage-bundle
          path: ${{ runner.temp }}/coverage-bundle

      - name: Install the bounded exact-run coverage bundle
        if: steps.brain.outputs.configured == 'true'
        run: |
          node scripts/coverage-bundle.mjs install \
            --bundle "$RUNNER_TEMP/coverage-bundle" \
            --dest coverage \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --run-id "${{ steps.coverage.outputs.run-id }}"

      - name: Fetch the ingestion scanner from aios-team-brain
        if: steps.brain.outputs.configured == 'true'
        run: bash .github/scripts/fetch-brain-scanner.sh .brain-scanner

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.brain.outputs.configured == 'true'
        with:
          python-version: "3.12"

      - name: Install scanner runtime dependencies
        if: steps.brain.outputs.configured == 'true'
        run: >-
          pip install --only-binary=:all: --require-hashes
          -r .github/scripts/brain-scanner-requirements.txt

      - name: Compute codebase health (opt-in; default OFF)
        if: steps.brain.outputs.configured == 'true' && vars.AIOS_PUSH_CODEBASE_HEALTH == '1'
        continue-on-error: true
        run: |
          npm ci --ignore-scripts
          rm -f -- \
            "$RUNNER_TEMP/codebase-health.v1.json" \
            "$RUNNER_TEMP/codebase-health.v1.json.partial" \
            "$RUNNER_TEMP/codebase-health.contract.json" \
            "$RUNNER_TEMP/codebase-health.contract.json.partial"
          node scripts/aios.mjs codebase-health --json \
            > "$RUNNER_TEMP/codebase-health.v1.json.partial"
          mv \
            "$RUNNER_TEMP/codebase-health.v1.json.partial" \
            "$RUNNER_TEMP/codebase-health.v1.json"
          node scripts/codebase-health/push-payload.mjs "$RUNNER_TEMP/codebase-health.v1.json" \
            > "$RUNNER_TEMP/codebase-health.contract.json.partial"
          mv \
            "$RUNNER_TEMP/codebase-health.contract.json.partial" \
            "$RUNNER_TEMP/codebase-health.contract.json"

      - name: Scan this repo into the brain
        if: steps.brain.outputs.configured == 'true'
        env:
          AIOS_API_KEY: ${{ secrets.AIOS_API_KEY }}
          BRAIN_URL: ${{ secrets.AIOS_BRAIN_URL }}
          AIOS_TEAM: ${{ secrets.AIOS_TEAM }}
          GITHUB_TOKEN: ${{ github.token }}
          AIOS_PUSH_CODEBASE_HEALTH: ${{ vars.AIOS_PUSH_CODEBASE_HEALTH }}
          PYTHONPATH: .brain-scanner/ingestion
        run: |
          case "$BRAIN_URL" in
            https://?*) ;;
            *) echo "BRAIN_URL must use HTTPS" >&2; exit 1 ;;
          esac
          HEALTH_JSON="$RUNNER_TEMP/codebase-health.contract.json"
          if [ "${AIOS_PUSH_CODEBASE_HEALTH:-}" = "1" ] && [ -s "$HEALTH_JSON" ]; then
            python .github/scripts/scan_with_health.py \
              --path . --slug aios-workspace --full-name "$GITHUB_REPOSITORY" \
              --health-json "$HEALTH_JSON"
          else
            python -m aios_ingest.cli scan \
              --path . --slug aios-workspace --full-name "$GITHUB_REPOSITORY"
          fi

      - name: Skip note
        if: steps.brain.outputs.configured != 'true'
        run: echo "scan secrets not configured (BRAIN_URL/AIOS_TEAM/AIOS_API_KEY) — skipping."
