name: AIOS work sync

# ── Credential isolation (why this is pull_request_target) ───────────────────────────────────
# Under `pull_request` GitHub takes the workflow file itself from the PR head, so a same-repo
# branch PR could rewrite this file — delete the `merged == true` guard and print
# AIOS_API_KEY / AIOS_BRAIN_URL / AIOS_TEAM — then simply close its own PR to fire it. No merge,
# no review. `pull_request_target` runs the base branch's copy instead, so the guard and the
# inline program below are trusted, reviewed code.
#
# What keeps that trigger safe here:
#   1. Nothing from the PR head is checked out, fetched, installed, built, or executed — there is
#      no `actions/checkout` at all. The only code that runs is the base-branch Node program below.
#   2. Every PR-derived value reaches that program through `env:` and is read with `process.env`.
#      No `${{ github.event.* }}` value is interpolated into a `run:` body, and the program no
#      longer parses GITHUB_EVENT_PATH — so the exact set of PR fields it trusts is visible in the
#      YAML rather than implied by a whole-payload read.
#   3. The job is scoped to same-repository pull requests. Under `pull_request` a fork run got no
#      secrets and soft-skipped; the guard preserves that instead of newly handing the Brain
#      credentials to a run an outside contributor can start.
#   4. `permissions:` is read-only: no `statuses: write`, no `checks: write`.
#
# What the `trusted-automation` Environment is NOT: a boundary against forks. Verified
# empirically — under `pull_request_target` GITHUB_REF is always the base branch, so a fork PR
# satisfies a `main`-only deployment branch policy and does receive the environment's secrets.
# It is a blast-radius control over WHICH workflows here may read AIOS_API_KEY / AIOS_BRAIN_URL /
# AIOS_TEAM, not over who can trigger them. Points 1-3 are the actual protection.

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  notify-brain:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10 # observed p100 0.2 min
    environment: trusted-automation
    env:
      AIOS_BRAIN_URL: ${{ secrets.AIOS_BRAIN_URL }}
      AIOS_API_KEY: ${{ secrets.AIOS_API_KEY }}
      AIOS_TEAM: ${{ secrets.AIOS_TEAM }}
      AIOS_PROJECT: aios-workspace
    steps:
      - name: Post merged work event
        env:
          # Attacker-controlled PR metadata, passed as data. Never inlined into the script body.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HTML_URL: ${{ github.event.pull_request.html_url }}
          PR_MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          PR_USER: ${{ github.event.pull_request.user.login }}
        run: |
          node <<'NODE'
          const brain = process.env.AIOS_BRAIN_URL;
          const key = process.env.AIOS_API_KEY;
          const team = process.env.AIOS_TEAM;
          if (!brain || !key || !team) {
            // Reachable only when the values have not been entered yet. A branch-policy mismatch
            // fails the job before any step runs, so this cannot mask a misconfigured environment.
            console.log("AIOS work sync skipped: AIOS_BRAIN_URL, AIOS_API_KEY, or AIOS_TEAM is not configured.");
            process.exit(0);
          }

          // Read only through these env vars — the workflow no longer parses GITHUB_EVENT_PATH,
          // so the exact set of PR fields this job trusts is visible in the YAML above.
          const pr = {
            title: process.env.PR_TITLE || "",
            body: process.env.PR_BODY || "",
            headRef: process.env.PR_HEAD_REF || "",
            headSha: process.env.PR_HEAD_SHA || "",
            htmlUrl: process.env.PR_HTML_URL || "",
            mergeCommitSha: process.env.PR_MERGE_COMMIT_SHA || "",
            mergedBy: process.env.PR_MERGED_BY || "",
            user: process.env.PR_USER || "",
          };
          // Resolve work keys using a priority-based rule so body-only mentions
          // (context, "blocked by", spec refs) never close unrelated issues.
          // Canonical source: .github/lib/resolve-work-keys.mjs — generated copy, keep identical.
          const WORK_KEY_RE = /\b([A-Z][A-Z0-9]+-\d+|[A-Z]\d+(?:\.\d+)*)\b/g;

          // Branch keys: Linear-shaped only (two+ letters, hyphen, digits), anchored at the start of the
          // branch or of the segment after `type/`. Unanchored matching manufactured `V0.11.1` from
          // `release/v0.11.1` and `API-1` from `brain-api-1.22-…`, outranking the real key in the title.
          const BRANCH_KEY_RE = /^(?:[^/]{1,256}\/)?([A-Z]{2,}[A-Z0-9]{0,32}-\d+)(?![A-Z0-9])/i;
          const KEY_ONLY_RE = /^(?:[A-Z][A-Z0-9]+-\d+|[A-Z]\d+(?:\.\d+)*)$/;

          // Trailer tokens may be wrapped the way people write them in Markdown: `AIO-5`, (AIO-5), [AIO-5](url),
          // AIO-5. or AIO-5; strip that before testing the token, or an explicit trailer silently loses.
          const unwrap = (tok) =>
            tok.replace(/^\[([^\]]+)\]\([^)]*\)/, "$1").replace(/^[[(`*_"']+|[\])`*_.,;:"']+$/g, "");

          function resolveWorkKeys(title, body, headRef, notes = []) {
            title = String(title ?? "");
            headRef = String(headRef ?? "");
            const cleanBody = String(body ?? "").replace(/<!--[\s\S]*?-->/g, " ");

            // 1. Explicit trailers — global iteration over ALL "AIOS-Work:" lines.
            //    Each line may list multiple keys: "AIOS-Work: AIO-531 AIO-532".
            //    Line-anchored (^…gm) so an empty trailer line cannot swallow the next
            //    line and treat a body mention as an explicit key.
            const trailerLineRe = /^[ \t]*AIOS-Work:[ \t]*([^\r\n]+)/gm;
            const trailerKeys = [];
            let sawTrailer = false;
            for (const line of cleanBody.matchAll(trailerLineRe)) {
              sawTrailer = true;
              // Only the leading run of keys counts: `AIOS-Work: AIO-568 (epic AIO-541)` closes AIO-568, not
              // the epic named in the aside. Keys are separated by spaces or commas; the first other token stops it.
              for (const raw of line[1].split(/[\s,]+/)) {
                const tok = unwrap(raw);
                if (!tok) continue;
                if (!KEY_ONLY_RE.test(tok)) break;
                trailerKeys.push(tok);
              }
            }
            if (trailerKeys.length > 0) return [...new Set(trailerKeys)];
            if (sawTrailer) notes.push("an AIOS-Work trailer is present but no key could be read from it; falling back to branch and title");

            // 2. Branch name — first (leading) key only; a branch encodes one issue.
            const bm = headRef.match(BRANCH_KEY_RE);
            if (bm) return [bm[1].toUpperCase()];

            // 3. PR title — the first Linear-shaped key; a hierarchical key (W2.5.8) only if it has a dot and
            //    no Linear key exists, so a dotless token like Q3 or V2 can never shadow the real key.
            const titleKeys = title.match(WORK_KEY_RE) ?? [];
            const pick = titleKeys.find((k) => /-\d+$/.test(k)) ?? titleKeys.find((k) => k.includes("."));
            if (pick) return [pick];

            // 4. Body-only mentions → no work event.
            return [];
          }
          const notes = [];
          const workKeys = resolveWorkKeys(pr.title, pr.body, pr.headRef, notes);
          for (const n of notes) console.log(`aios-work-sync: note: ${n}`);
          // Make a branch/title disagreement visible in the run log (a branch typo silently wins).
          const titleKeys = String(pr.title ?? "").match(WORK_KEY_RE) || [];
          if (workKeys.length && titleKeys.length && !workKeys.some((k) => titleKeys.includes(k))) {
            console.log(`aios-work-sync: note: resolved ${workKeys.join(",")} but the title names ${titleKeys.join(",")}`);
          }
          // No key this PR implements: post nothing. The brain re-derives keys from pr_body when
          // work_keys is empty (ingest.ts), which would close every issue the body merely mentions.
          if (workKeys.length === 0) {
            console.log("aios-work-sync: no work key in trailer, branch or title; no event posted");
            process.exit(0);
          }

          const payload = {
            project: process.env.AIOS_PROJECT,
            // Runner-provided, not PR-controlled — same value the event payload's
            // `repository.full_name` carried.
            repo: process.env.GITHUB_REPOSITORY,
            event_kind: "merged",
            merged_sha: pr.mergeCommitSha || pr.headSha,
            pr_url: pr.htmlUrl,
            pr_title: pr.title,
            pr_body: pr.body,
            branch: pr.headRef,
            work_keys: workKeys,
            actor: pr.mergedBy || pr.user || "",
          };

          const url = `${brain.replace(/\/$/, "")}/api/v1/work-events`;
          fetch(url, {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${key}`,
              "X-AIOS-Team": team,
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          }).then(async (res) => {
            const body = await res.text();
            if (!res.ok) {
              console.error(`AIOS work sync failed: ${res.status} ${body}`);
              process.exit(1);
            }
            console.log(body);
          }).catch((err) => {
            console.error(err);
            process.exit(1);
          });
          NODE
