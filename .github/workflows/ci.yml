name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref (saves CI time on rapid pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # EVERY job below carries an explicit `timeout-minutes`. GitHub's default is 360
  # (six hours), so a job that hangs — a leaked HTTP listener or child process keeping
  # the Node process alive after the tests already passed — holds a runner for six hours
  # while the check still renders as "in progress". That is exactly what happened on
  # PR #549: `Coverage shard (2/3)` and `Node tests (2/3)` each burned five hours, twice.
  # The values are set from observed p100 durations of recent successful runs (see the
  # PR body for the table); they are generous multiples, sized so a slow runner never
  # flakes but a hang is loud in minutes instead of hours. When a lane legitimately gets
  # slower, raise its number here deliberately — do not delete it.
  #
  # Path filtering is applied at JOB level (`if:`), never at workflow level
  # (`on.pull_request.paths`). A skipped JOB still reports a check run; a workflow
  # that never triggers leaves the three protected contexts pending forever and no PR
  # can merge again. Do not move these filters up to the `on:` block.
  #
  # The CI-owned protected contexts (`secrets + harness checks`, `lint + format`,
  # `unit tests (npm test)`) are never filtered — see scripts/ci-changed-lanes.mjs for why
  # each exclusion is deliberate. The isolated `confidentiality leak gate` and the
  # `review-evidence` status are produced by separate trusted workflows.
  #
  # Every filter below is written `!= 'false'`, NOT `== 'true'`. If the detect step ever
  # fails to write an output — a crash, a rename, a guard that stops firing — `== 'true'`
  # would silently skip the lane, and `test-gate` counts skips as passing, so the whole
  # matrix would evaporate while the PR stayed green. `!= 'false'` means only an explicit
  # `false` skips anything; absent, empty, or malformed all RUN the lane. The lane values
  # must earn a skip, not inherit one.
  changes:
    permissions:
      contents: read
      pull-requests: read
    name: Detect changed lanes
    runs-on: ubuntu-latest
    timeout-minutes: 10 # observed p100 0.7 min (a gh api call + one node script)
    outputs:
      code: ${{ steps.detect.outputs.code }}
      rust: ${{ steps.detect.outputs.rust }}
      client: ${{ steps.detect.outputs.client }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: List the PR's changed paths
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        # Any failure here must leave changed-paths.txt ABSENT, not partial: the
        # classifier turns every lane on when it cannot read a list. A push to main
        # skips this step entirely and therefore runs the full matrix.
        run: |
          gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' \
            > changed-paths.txt || rm -f changed-paths.txt
      - id: detect
        run: node scripts/ci-changed-lanes.mjs --paths-from changed-paths.txt

  docs-drift:
    name: Docs drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 10 # observed p100 0.7 min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm run check:docs

  context-health:
    name: Context health guard
    runs-on: ubuntu-latest
    timeout-minutes: 10 # observed p100 0.5 min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm run check:context

  # Static policy over this repo's own workflow YAML (leak-gate-remediation-plan.md §5.1 item 3).
  #
  # READ THIS BEFORE ADDING ANYTHING TO THIS JOB. It is deliberately the least privileged job in
  # the file: `contents: read`, no secret, no `checks`/`statuses` scope, no network. It does NOT
  # create, write, or satisfy the required `AIOS Security Gate` status — that status may only ever
  # come from the `aios-security-gate` GitHub App (plan §1 invariant 3), and an Actions job that
  # could write it would be the forgery primitive the policy exists to remove. Giving this job a
  # secret or a write scope to "make it more useful" defeats its own rule set.
  #
  # THE JUDGING CODE COMES FROM THE BASE REVISION, NEVER FROM THE PULL REQUEST. This job first
  # checked out the merge revision and ran the PR's own copy of the checker, which meant a PR could
  # add a secret-exfiltrating workflow AND, in the same PR, edit the checker to return success or
  # grant itself an allowlist waiver — and this required lane would go green. Same reasoning and
  # same shape as `.github/workflows/pr-review-evidence.yml`. The allowlist is resolved from the
  # base revision for the identical reason: a PR that can add its own waiver is the same bypass.
  # The PR's workflow files are read as DATA from a separate `candidate/` checkout; nothing in that
  # tree is executed, which is the property the checker already guarantees for YAML.
  #
  # Its own actions are SHA-pinned because they are new here. The pre-existing `@vN` refs elsewhere
  # in this file are real `mutable-action-ref` findings, waived per job in
  # scripts/workflow-policy-allowlist.json and owned by the separate org-wide pinning workstream.
  #
  # No `npm ci`: the checker is zero-dependency, like every other guard under scripts/.
  workflow-policy:
    name: workflow policy (PR-reachable workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the gate from the base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Locate the gate
        id: gate
        run: |
          if test -f scripts/check-workflow-policy.mjs; then
            echo "root=$PWD" >> "$GITHUB_OUTPUT"
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          else
            echo "root=$PWD/pr-head" >> "$GITHUB_OUTPUT"
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Workflow-policy gate bootstrap::The base revision does not carry the gate yet, so this run judges with the pull request's own copy. This path is correct ONLY for the PR that introduces the gate; every later PR is judged by the base-revision checker, because by then the base carries it."
          fi

      - name: Bootstrap — judge with the PR's own copy (base has no gate yet)
        if: steps.gate.outputs.bootstrap == 'true' && github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: pr-head
          persist-credentials: false

      # The candidate tree is scanner INPUT only. The checker parses YAML as data and never
      # executes a workflow, a step, an action, or a `run:` body.
      - name: Check out the candidate tree as inert scanner input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Workflow policy (base-revision gate over the candidate workflows)
        working-directory: candidate
        env:
          GATE_ROOT: ${{ steps.gate.outputs.root }}
        run: |
          node "$GATE_ROOT/scripts/check-workflow-policy.mjs" \
            --allowlist "$GATE_ROOT/scripts/workflow-policy-allowlist.json"

  constitution:
    name: Constitution guards (domain isolation + boundaries + size)
    runs-on: ubuntu-latest
    timeout-minutes: 15 # observed p100 1.5 min (npm ci + the health scorer's gh calls)
    defaults:
      run:
        working-directory: candidate
    steps:
      - name: Check out trusted hygiene files from the base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          path: trusted-hygiene
          persist-credentials: false
      - name: Check out candidate files as inert hygiene input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Establish these files on the base before enabling this job in a fresh repository.
      # No fallback to candidate code/configuration. Dependencies resolve from the base scripts.
      - name: Verify trusted hygiene files
        run: |
          for file in scripts/check-file-size.mjs scripts/size-caps.json scripts/check-boundaries.mjs scripts/boundaries.json scripts/git-files.mjs validation/agent-readiness-lib.mjs; do
            if ! test -f "$GITHUB_WORKSPACE/trusted-hygiene/$file"; then
              echo "::error::Missing trusted hygiene file: $file. Establish the gate on the base before enforcing it."
              exit 1
            fi
          done
      - name: File-size gate (default-deny, ratchet-only-down)
        run: node "$GITHUB_WORKSPACE/trusted-hygiene/scripts/check-file-size.mjs" --config "$GITHUB_WORKSPACE/trusted-hygiene/scripts/size-caps.json"
      - name: Repo-boundary gate
        run: node "$GITHUB_WORKSPACE/trusted-hygiene/scripts/check-boundaries.mjs" --allow-stale
      # §4 domains-are-siblings (no cross-domain value imports) + the repo-boundary
      # seam gate for the multi-repo split (AIO-597) + the aios.mjs size gate (AIO-320).
      - run: npm run check:domains
      - run: npm run check:inbox-audit
      # AIO-927: the two canonical aios-linear skill copies (.claude/skills/aios-linear/
      # and scaffold/.claude/skills/aios-linear/) must stay byte-identical.
      - run: npm run check:linear-skill-parity
      # ADVISORY codebase-health delta vs the committed baseline (AIO-605). Always exits 0 in
      # v0.9.0 — prints score/band deltas, cannot fail the release; advisory→ratchet is a
      # separate later decision. npm ci is needed so the lint/type axis can actually score.
      - run: npm ci
      - name: Codebase health (advisory, never a gate)
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run check:codebase-health

  guard:
    name: secrets + harness checks
    runs-on: ubuntu-latest
    timeout-minutes: 15 # observed p100 1.8 min (three scaffolds + validators + eval smoke)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Secret scan
        run: bash validation/check-secrets.sh .

      - name: Harness syntax check
        run: |
          for f in scaffold/.claude/skills/*/*.workflow.js; do
            if node -e "const s=require('fs').readFileSync('$f','utf8'); new Function('agent','parallel','pipeline','phase','log','args','budget','workflow','return (async()=>{'+s.replace(/export const meta/,'const meta')+'})')"; then
              echo "ok: $f"
            else
              echo "FAIL: $f"
              exit 1
            fi
          done

      - name: Sync CLI syntax check
        run: node --check scripts/aios.mjs

      # All test files, including skill/runtime contracts, run exactly once in
      # the sharded Node suite. Keep only unique static/security checks here.

      - name: Scaffold smoke test + validate (project profile)
        run: |
          bash scripts/scaffold-project.sh \
            --slug ci-sample-team-ops --stakeholder "Sample Co" --lead alex \
            --members "alex,sam,jordan" --org your-github-org --currency USD \
            --output /tmp/ci-sample-team-ops
          bash validation/validate-all.sh /tmp/ci-sample-team-ops

      - name: Scaffold smoke test + validate (legacy engagement profile)
        run: |
          bash scripts/scaffold-engagement.sh \
            --slug ci-sample-eng-ops --client "Sample Co" --captain alex \
            --members "alex,sam,jordan" --org your-github-org --currency USD \
            --output /tmp/ci-sample-eng-ops
          bash validation/validate-all.sh /tmp/ci-sample-eng-ops

      - name: Scaffold smoke test + validate (business-owner context)
        run: |
          bash scripts/scaffold-project.sh \
            --context business-owner \
            --slug ci-sample-bo-ops --stakeholder "Sample Co" --owner alex \
            --members "alex,sam,jordan" --org your-github-org --currency USD \
            --output /tmp/ci-sample-bo-ops
          bash validation/validate-all.sh /tmp/ci-sample-bo-ops
          # 6-business/ must exist and must never be in sync_include (AIO-351).
          test -d /tmp/ci-sample-bo-ops/6-business
          ! grep -A20 '^sync_include:' /tmp/ci-sample-bo-ops/aios.yaml | grep -q '6-business'

      - name: Sync client offline smoke (status + dry-run push)
        run: |
          node scripts/aios.mjs status --repo /tmp/ci-sample-team-ops
          node scripts/aios.mjs push --dry-run --repo /tmp/ci-sample-team-ops
          node scripts/aios.mjs status --porcelain --repo /tmp/ci-sample-team-ops

      - name: Onboard non-TTY smoke (prints guidance, exits 0)
        run: node scripts/aios.mjs onboard --repo /tmp/ci-sample-team-ops < /dev/null

      - name: Onboarding eval lab smoke (mock driver + mock judge)
        # Proves the vendored lab's own wiring (setup -> install -> grade -> judge ->
        # aggregate) still runs end to end — catches a scaffold/CLI change breaking a
        # scenario's fixture, or a future sync-eval-lab.sh --apply pulling a core
        # incompatible with this repo's adapters, before either merges green.
        run: |
          bash evals/run.sh --runtime mock --scenario all --runs 1 --judge mock \
            --results-dir /tmp/ci-eval-lab-smoke
          jq -e '.total > 0 and .by_status.pass == .total' /tmp/ci-eval-lab-smoke/summary.json

  clean-container:
    name: clean-container install (no jq)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # THE lane that would have caught the 0.11.0 jq fail-open, and the OGR09 and ajv defects
    # before it. All three were invisible in exactly the same way: macOS 15+ ships /usr/bin/jq and
    # the ubuntu-latest runner image pre-installs it, so the developer machine, every other job
    # in this file, and the release gate all agreed the release worked. A bare node:22 image is
    # the only place the missing dependency is observable. Do NOT "fix" a failure here by
    # apt-get installing the missing tool in this job — that is the mistake this lane exists to
    # make impossible.
    #
    # This lane builds and then EXECUTES repository code (tsc, then a container running the
    # packed tarball), so it gets the narrowest credentials that still let it do that: a
    # read-only token, and no checkout credentials left behind in .git/config for that code
    # to find.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      # This lane only needs tsc to build dist/ and then npm pack; nothing here runs the
      # native better-sqlite3 binding, so dependency lifecycle scripts are not needed and
      # are not run.
      - run: npm ci --ignore-scripts
      - name: Pack the tarball
        # dist/ is gitignored, so build it first or the packed artifact is not what a
        # release publishes. --pack-destination does not create its directory; npm ENOENTs
        # on a missing one.
        run: |
          npm run build:loop
          mkdir -p /tmp/pack
          npm pack --pack-destination /tmp/pack
          ls -l /tmp/pack
      - name: Install + validate in a bare node:22 container with no jq
        run: |
          docker run --rm -v /tmp/pack:/pack:ro -v "$PWD/.github/scripts":/ci:ro \
            node:22 bash /ci/clean-container-check.sh
      - name: Same container, with jq installed — nothing may regress
        run: |
          docker run --rm -v /tmp/pack:/pack:ro -v "$PWD/.github/scripts":/ci:ro \
            node:22 bash -c 'apt-get update -qq && apt-get install -y -qq jq >/dev/null && bash /ci/clean-container-check.sh'

  scrubbed-env-connectors:
    name: scrubbed-env connectors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # AIO-1028: the connector/credential suites must hold in BOTH environments the unit
    # shards can never provide:
    #   1. a fully scrubbed one (`env -i`, throwaway HOME, Node-only PATH) — catches code
    #      that only works because direnv exported the keys or Homebrew put dotenvx/jq-like
    #      tools on PATH (the AIO-1029 devDependency escape was invisible everywhere else);
    #   2. a decoy-loaded one (synthetic LINEAR/AIOS/SLACK/GRANOLA/OPENAI/DOTENV values
    #      exported, the shape of every direnv developer machine) — catches fixture
    #      assertions that lose to the ambient environment. CI has no real credentials,
    #      so WITHOUT this step a regression of the AIO-1028 class is invisible in CI by
    #      construction and lands on every developer machine as "baseline noise".
    # Deliberately a separate lane, like `clean-container install (no jq)`: the point is
    # the environment, and the unit shards inherit the runner's.
    env:
      # Pure-Node connector/credential suites — runnable under a Node-only PATH.
      # test/scaffold-next-action.test.mjs is credential-coupled too but shells out to
      # bash, so it joins only the decoy step (full PATH).
      SCRUBBED_SUITES: >-
        test/brain-config-dotenvx.test.mjs
        test/brain-config.test.mjs
        test/brain-client-auth.test.mjs
        test/connector-cli.test.mjs
        test/connector-dotenvx-resolution.test.mjs
        test/connector-existing-credential.test.mjs
        test/connector-oauth.test.mjs
        test/connector-routing-guard.test.mjs
        test/ensure-env.test.mjs
        test/global-connector-cli.test.mjs
        test/granola-auth-path.test.mjs
        test/granola-never-clobber.test.mjs
        test/linear-dotenvx-scope.test.mjs
        test/scrubbed-env-helper.test.mjs
        test/suggest-connectors.test.mjs
        test/sync-execution-smoke.test.mjs
        test/vault-error-surfacing.test.mjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      # These suites never touch the native better-sqlite3 binding; skip lifecycle scripts
      # so the lane stays fast and builds nothing it does not run.
      - run: npm ci --ignore-scripts
      - name: Connector suites under env -i (throwaway HOME, Node-only PATH)
        run: |
          SCRUB_HOME="$(mktemp -d)"
          NODE_DIR="$(dirname "$(command -v node)")"
          # the list is a deliberate word-split
          # shellcheck disable=SC2086
          env -i HOME="$SCRUB_HOME" PATH="$NODE_DIR" \
            node --test $SCRUBBED_SUITES
      - name: Same suites with decoy ambient credentials (the direnv-machine shape)
        # Decoys are synthetic and generated here, never committed as key-shaped literals.
        # If a fixture assertion can lose to the ambient environment, it loses to these
        # decoys right here instead of on a developer machine with real keys.
        run: |
          export LINEAR_API_KEY="lin_api_fake_decoy_ci_1028"
          export AIOS_API_KEY="aios_k_fake_decoy_ci_1028"
          export AIOS_BRAIN_URL="https://decoy-brain.invalid"
          export AIOS_TEAM="decoy-team"
          export SLACK_USER_TOKEN="xoxp-fake-decoy-ci-1028"
          export GRANOLA_API_KEY="grn_fake_decoy_ci_1028"
          export OPENAI_API_KEY="sk-fake-decoy-ci-1028"
          DOTENV_PUBLIC_KEY="0$(printf '1%.0s' $(seq 65))"
          DOTENV_PRIVATE_KEY="$(printf 'd%.0s' $(seq 64))"
          export DOTENV_PUBLIC_KEY DOTENV_PRIVATE_KEY
          # the list is a deliberate word-split
          # shellcheck disable=SC2086
          node --test $SCRUBBED_SUITES test/scaffold-next-action.test.mjs

  lint:
    name: lint + format
    runs-on: ubuntu-latest
    timeout-minutes: 10 # observed p100 1.6 min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier (format check)
        run: npm run format:check

  node-tests:
    name: Node tests (${{ matrix.shard }}/3, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20 # observed p100 2.6 min per shard
    strategy:
      fail-fast: false
      # The Node dimension is what makes `engines.node: ">=22"` a tested claim
      # instead of an assertion (AIO-628). `@aiosbrain/foundation` is published,
      # so that range propagates to every downstream consumer; npm only warns on
      # engines, but yarn and pnpm hard-fail, so an unverified upper bound is a
      # real install failure for an OSS user on a newer LTS.
      #
      # 22 is the development pin (.nvmrc / .node-version — do NOT bump those to
      # match this list). 24 and 26 are the majors users actually land on.
      #
      # This matrix is DELIBERATELY confined to this lane. Do not fan the
      # coverage-shard / coverage lanes out over Node versions: the ratchet
      # compares a single merged report against a stored baseline, so N runtimes
      # would produce N baselines racing one file. One runtime executes the
      # coverage lanes; this lane proves the runtime range.
      matrix:
        shard: [1, 2, 3]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Run shard
        run: npm run test:node -- --shard=${{ matrix.shard }}/3 --concurrency=2

  coverage-shard:
    name: Coverage shard (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 25 # observed p100 8.2 min for the slowest shard
    strategy:
      fail-fast: false
      matrix:
        # SYNC: the coverage shard total "3" appears in three places — this
        # matrix, `--shard k/3` below, and `--merge 3` in the coverage job.
        # Change all three together. run-coverage's merge fails loudly when a
        # coverage/shard-<k> beyond the merge total exists, so drift goes red.
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run coverage shard (raw c8 data only, no report/check)
        run: node scripts/run-coverage.mjs --shard ${{ matrix.shard }}/3
      - name: Upload shard coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage/shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 1

  coverage:
    # The gating lane for the ratchet: merges the parallel shards above so the
    # full ~254-file suite no longer runs unsharded on the PR critical path.
    name: Corrected coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 20 # observed p100 2.9 min (download + merge + ratchet)
    needs: coverage-shard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # check-coverage.mjs diffs changed lines against the merge base.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download shard coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: coverage-shard-*
          path: coverage-shards
      - name: Arrange shard data for merge
        run: |
          mkdir -p coverage
          for dir in coverage-shards/coverage-shard-*; do
            mv "$dir" "coverage/shard-${dir##*-}"
          done
          ls coverage/
      - name: Merge shards into report + baseline candidate
        run: node scripts/run-coverage.mjs --merge 3
      - name: Enforce coverage ratchet
        run: node scripts/check-coverage.mjs
      - name: Raise-the-floor nudge
        run: |
          candidate=coverage/coverage-baseline-candidate.json
          if [ ! -f "$candidate" ]; then
            echo "no baseline candidate at $candidate; skipping raise-the-floor check"
            exit 0
          fi
          # jq join(", ") — not `paste -sd ', '`, which cycles its delimiter
          # characters per line instead of joining pairs, garbling 3+ metrics.
          oneline=$(jq -r --slurpfile base coverage-baseline.json '
            [ (.minimum // {}) | to_entries[]
              | ($base[0].minimum[.key] // null) as $floor
              | select($floor != null and .value > $floor)
              | "\(.key): \($floor)% -> \(.value)%"
            ] | join(", ")
          ' "$candidate")
          if [ -z "$oneline" ]; then
            echo "baseline candidate does not exceed the tracked floor; nothing to raise"
            exit 0
          fi
          echo "::notice title=Coverage floor can be raised::Baseline candidate beats coverage-baseline.json ($oneline). Copy coverage/coverage-baseline-candidate.json (in the coverage artifact) over coverage-baseline.json to tighten the ratchet."
          {
            echo "### Coverage ratchet can be tightened"
            echo
            echo "This run's baseline candidate exceeds the tracked \`coverage-baseline.json\` floor:"
            echo
            echo "| metric | tracked floor | candidate |"
            echo "|--------|---------------|-----------|"
            jq -r --slurpfile base coverage-baseline.json '
              (.minimum // {}) | to_entries[]
              | ($base[0].minimum[.key] // null) as $floor
              | select($floor != null and .value > $floor)
              | "| \(.key) | \($floor)% | \(.value)% |"
            ' "$candidate"
            echo
            echo "Download the \`coverage-bundle\` artifact and update \`coverage-baseline.json\` from its root \`coverage-baseline-candidate.json\` to lock in the gain."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Pack exact-run coverage bundle
        run: |
          node scripts/coverage-bundle.mjs pack \
            --source coverage \
            --out "$RUNNER_TEMP/coverage-bundle" \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID"
      - name: Upload exact-run coverage bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: coverage-bundle
          path: ${{ runner.temp }}/coverage-bundle
          if-no-files-found: error
          retention-days: 7

  pack-golden:
    # AIO-668: the @aiosbrain/aios npm package must stay repo-clone-independent.
    # Packs the tarball, installs it into a clean prefix, then scaffolds +
    # validates + runs offline `aios status` from the installed location only.
    name: npm pack golden path (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10 # observed p100 1.3 min
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    needs: changes
    if: needs.changes.outputs.code != 'false'
    env:
      npm_config_engine_strict: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:pack-golden

  publish-npm-parity:
    # The publish path runs a DIFFERENT npm major than every lane above. Trusted
    # publishing needs npm >= 11.5.1, so publish-npm.yml installs the pin from
    # `.npm-version` (12.0.2 today), while every other job here — pack-golden
    # included — runs whatever npm ships bundled with Node 22 (10.x/11.x).
    #
    # Nothing exercised that npm major, and the publish workflow is manual-dispatch
    # only, so its own gates were the first thing to see a difference. npm 12 changed
    # two `--json` output shapes: `npm view <exact-spec> version --json` went from a
    # bare string to a single-element array, and `npm pack --json` went from an array
    # of records to an OBJECT keyed by package name. The sibling aios-devtools repo
    # hit exactly this — two tests parsed the old shapes, stayed green on every PR,
    # and broke only at publish time. The same three npm-surface tests live here
    # (npm-pack-manifest, npm-pack-golden-path, foundation-package), two of which ARE
    # publish gates, so this repo had the identical latent divergence.
    #
    # This lane runs the WHOLE Node suite on the pinned npm rather than a hand-listed
    # subset: a file list in YAML rots the moment someone adds another test that
    # shells out to npm, which is the failure mode being fixed. It is mandatory via
    # `test-gate` below, so a shape/behaviour difference under the publishing npm now
    # fails a PR check instead of a release.
    #
    # WHY NOT pin this npm across all lanes: `node-tests` on the bundled npm is what
    # proves the suite works for an OSS consumer, who has whatever npm their Node
    # shipped (`engines.node: ">=22"` propagates through @aiosbrain/foundation).
    # Pinning everywhere deletes that coverage and couples all of CI to one npm bump.
    # Two lanes, one pin, read from one file.
    name: unit tests (publish lane npm)
    runs-on: ubuntu-latest
    timeout-minutes: 30 # unsharded full suite; node-tests p100 is 2.6 min per 1/3 shard
    needs: changes
    if: needs.changes.outputs.code != 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      # Byte-identical install line to publish-npm.yml, reading the same `.npm-version`.
      # The exact x.y.z assertion is not cosmetic: a range or `latest` here would
      # silently stop testing the version that actually publishes.
      - name: Install the pinned npm the publish workflow uses
        run: |
          PINNED_NPM="$(tr -d '[:space:]' < .npm-version)"
          if ! printf '%s' "$PINNED_NPM" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::.npm-version must contain an exact x.y.z npm version (got '$PINNED_NPM')"
            exit 1
          fi
          npm install -g "npm@$PINNED_NPM" --ignore-scripts
          npm --version
      # --ignore-scripts, then build explicitly: the postinstall hook only builds the
      # operator loop, and test:node's `ensure-loop-built --strict` preamble needs that
      # artifact either way. What this lane exists to compare is npm's OUTPUT SHAPES
      # under a different major, not whether lifecycle hooks fire, so disabling them
      # costs no coverage. Same call the sibling aios-devtools repo made on its
      # toolkit-drift lane after SonarCloud flagged the identical pattern (AIO-699).
      - run: npm ci --ignore-scripts
      - run: npm run build:loop
      - name: Run the suite on the publish lane's npm
        run: npm run test:node -- --concurrency=2
      # test:node cannot reach the golden-path test — it self-skips unless
      # AIOS_PACK_GOLDEN_TESTS=1, so the `npm pack golden path` job above is its only
      # runner and that job uses the bundled npm. It is also the single test that
      # actually packs a tarball, installs it, and runs the installed bin, which makes
      # it the most publish-shaped surface in the repo and the one most exposed to an
      # npm behaviour change. Passing today on both majors; run it here so it stays
      # that way rather than being discovered at publish time.
      - name: Run the pack golden path on the publish lane's npm
        run: npm run test:pack-golden

  mutation:
    name: Changed-code mutation (calibration)
    runs-on: ubuntu-latest
    needs: changes
    # Advisory and never merge-blocking, but it can hold a runner for the full 45
    # minutes below — which is what starves other PRs' lanes. mutation.yml already
    # runs a full nightly mutation campaign on cron, so this PR-time lane now runs
    # only on push to main (AIO-630), and is skipped when the diff cannot contain
    # a mutant.
    if: github.event_name == 'push' && needs.changes.outputs.code != 'false'
    continue-on-error: true
    # 45 covers mid-size files; it still cannot finish a scripts/aios.mjs PR
    # (~90 min measured, AIO-540 shrinks it) or umbrella-suite groups on big
    # diffs — the lane is advisory calibration, not a gate (AIO-539).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # On a push event GITHUB_BASE_REF is empty and origin/main's tip IS the
      # pushed commit, so the old default base made this lane inert — the diff
      # was always empty and the job greened without measuring (AIO-1016).
      # `github.event.before` is the pre-push main tip (with squash merges,
      # exactly the merged PR's changed set); fetch-depth: 0 above keeps it
      # resolvable. When it isn't (all-zeros / rewritten history), the runner
      # prints an explicit skip instead of a measured-empty green.
      - run: npm run test:mutation
        env:
          MUTATION_BASE_SHA: ${{ github.event.before }}
      # The `test:mutation:smoke` step that lived here exercised the
      # Stryker/Vitest integration; both the script and the Vitest (gui/client)
      # group left with the AIO-612 cut, so the step could only fail (masked by
      # continue-on-error). Removed in AIO-534 instead of patching its
      # `if: always()` — do not reinstate without a script that exists.

  test-gate:
    # Preserve the existing protected-branch context while strengthening it:
    # this legacy name now aggregates every mandatory test lane below.
    name: unit tests (npm test)
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10 # observed p100 0.1 min (one jq over `needs`)
    # The `needs` list below is the SINGLE source of truth for the mandatory
    # lanes: the step iterates ${{ toJSON(needs) }}, so adding a lane here makes
    # it blocking automatically — there is no env-var mapping or shell list to
    # keep in sync (a lane missed there used to be silently non-blocking under
    # `if: always()`).
    needs:
      - changes
      - docs-drift
      - context-health
      - constitution
      - workflow-policy
      - guard
      - lint
      - node-tests
      - scrubbed-env-connectors
      - publish-npm-parity
      - coverage-shard
      - coverage
    steps:
      - name: Require every mandatory lane
        env:
          RESULTS: ${{ toJSON(needs) }}
        # `skipped` counts as passing because path filtering is what produces it —
        # but only for lanes listed here, and two entries above exist purely to keep
        # that from becoming a hole:
        #   - `changes`: if lane detection FAILS, every filtered lane is skipped. Without
        #     `changes` in this list the gate would see nothing but skips and pass
        #     vacuously.
        #   - `coverage-shard`: `coverage` is skipped when its shards fail, which used to
        #     surface here as a non-success. Now that skips pass, the shards must be
        #     judged directly.
        # `length > 0` stays: an empty needs object must never satisfy the gate.
        run: |
          if ! jq -e 'length > 0 and all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS" > /dev/null; then
            echo "one or more mandatory lanes did not succeed:"
            jq . <<< "$RESULTS"
            jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped")
              | "::error::mandatory lane \(.key) result: \(.value.result)"' <<< "$RESULTS"
            exit 1
          fi
          jq -r 'to_entries[] | "\(if .value.result == "skipped" then "skipped (not affected by this diff)" else "ok" end): \(.key)"' <<< "$RESULTS"
