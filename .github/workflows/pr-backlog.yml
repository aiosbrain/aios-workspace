name: pr-backlog

on:
  schedule:
    - cron: "0 9 * * 1" # Monday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  report:
    name: stale PR backlog report
    runs-on: ubuntu-latest
    timeout-minutes: 10 # observed p100 0.9 min
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Must stay >= the floor in package.json `engines.node`. This ran on
          # Node 20 — below the repo's own >=22 floor — until AIO-628.
          node-version: 22
      - name: Generate report
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run pr:backlog -- --repo "${{ github.repository }}" >> "$GITHUB_STEP_SUMMARY"
