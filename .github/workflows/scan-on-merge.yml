name: scan-on-merge

# Keep this workspace's agent-readiness fresh: on every merge to main, scan the repo and push a
# full scan (raw metrics + readiness) to the Team Brain. The scanner lives in the aios-team-brain
# repo (ingestion sidecar), so we sparse-checkout it. Read-only against the repo; idempotent on
# the brain (keyed by head_sha).
#
# Required repo secrets (until set, the job logs "skipping" and exits 0 — never red):
#   AIOS_BRAIN_URL    — e.g. https://aios-team-brain-production.up.railway.app
#   AIOS_TEAM         — team slug (e.g. aios)
#   AIOS_API_KEY      — a TEAM-TIER api key (codebase scans are team-tier; least-privilege)
#
# The scanner source is fetched anonymously from the public Team Brain repository at an exact
# commit. No cross-repository token is required.
#
# Optional repo VARIABLE (not a secret): AIOS_PUSH_CODEBASE_HEALTH=1 — also attach the
# workspace's codebase-health snapshot to the scan payload (AIO-608). Default OFF/absent.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: scan-on-merge
  cancel-in-progress: true

jobs:
  scan:
    name: codebase readiness scan → brain
    runs-on: ubuntu-latest
    if: github.repository == 'aiosbrain/aios-workspace'
    env:
      AIOS_API_KEY: ${{ secrets.AIOS_API_KEY }}
      BRAIN_URL: ${{ secrets.AIOS_BRAIN_URL }}
      AIOS_TEAM: ${{ secrets.AIOS_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — the scanner reads the commit window
          persist-credentials: false

      # Produce coverage/coverage-summary.json + lcov.info for the scanner's _read_coverage()
      # to pick up — otherwise test_coverage_pct lands null and the Codebases dashboard shows
      # "no reports" even though the suite exists and runs. `|| true`: this is a metrics
      # source, not a gate — never block the scan on coverage (the real gate lives in ci.yml).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.AIOS_API_KEY != ''
        with:
          # Repo pins Node 22 (engines >=22 <23; better-sqlite3 ABI) — same as ci.yml.
          node-version: "22"
          cache: "npm"
      - name: npm ci
        if: env.AIOS_API_KEY != ''
        run: npm ci
      - name: Generate coverage report (metrics source for the scanner)
        if: env.AIOS_API_KEY != ''
        run: npm run test:coverage || true

      - name: Fetch the ingestion scanner from aios-team-brain
        if: env.AIOS_API_KEY != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aiosbrain/aios-team-brain
          ref: 8c29919236e602af63508abf5e988d4ab1d97eff
          path: .brain-scanner
          sparse-checkout: ingestion
          persist-credentials: false
          token: ""

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: env.AIOS_API_KEY != ''
        with:
          python-version: "3.12"

      - name: Install the scanner
        if: env.AIOS_API_KEY != ''
        run: pip install -e .brain-scanner/ingestion

      # ── Codebase health (AIO-608) — default OFF ────────────────────────────────────────
      # Opt-in: score this merged head with `aios codebase-health --json` and map it to the
      # Brain API 1.15 metrics.codebase_health contract object (scripts/codebase-health/
      # push-payload.mjs), for the scan step below to attach to the SAME full-metrics
      # payload. default OFF — flip by setting repo variable AIOS_PUSH_CODEBASE_HEALTH=1
      # after the scan-on-merge secret is refreshed (delivery-manifest constraint). With
      # the variable absent this step is skipped and the scan behaves exactly as before.
      # continue-on-error: health is a metrics source, not a gate — a scorer/mapper failure
      # must never block the base scan (the scan step then pushes without health).
      - name: Compute codebase health (opt-in; default OFF)
        if: env.AIOS_API_KEY != '' && vars.AIOS_PUSH_CODEBASE_HEALTH == '1'
        continue-on-error: true
        run: |
          node scripts/aios.mjs codebase-health --json > "$RUNNER_TEMP/codebase-health.v1.json"
          node scripts/codebase-health/push-payload.mjs "$RUNNER_TEMP/codebase-health.v1.json" \
            > "$RUNNER_TEMP/codebase-health.contract.json"

      - name: Scan this repo into the brain
        if: env.AIOS_API_KEY != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AIOS_PUSH_CODEBASE_HEALTH: ${{ vars.AIOS_PUSH_CODEBASE_HEALTH }}
        # With AIOS_PUSH_CODEBASE_HEALTH unset (the default) this runs the exact same
        # `aios-ingest scan` command as before — byte-identical behavior. With the flag on
        # AND a mapped health file present, scan_with_health.py reuses the sidecar's own
        # analyzer + client to push the same full payload plus metrics.codebase_health
        # (never a sparse health-only payload — the brain 422s those).
        run: |
          HEALTH_JSON="$RUNNER_TEMP/codebase-health.contract.json"
          if [ "${AIOS_PUSH_CODEBASE_HEALTH:-}" = "1" ] && [ -s "$HEALTH_JSON" ]; then
            python .github/scripts/scan_with_health.py \
              --path . --slug aios-workspace --full-name "$GITHUB_REPOSITORY" \
              --health-json "$HEALTH_JSON"
          else
            aios-ingest scan --path . --slug aios-workspace --full-name "$GITHUB_REPOSITORY"
          fi

      - name: Skip note
        if: env.AIOS_API_KEY == ''
        run: echo "scan secrets not configured (BRAIN_URL/AIOS_TEAM/AIOS_API_KEY) — skipping."
