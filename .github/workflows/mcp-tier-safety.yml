name: MCP authorization boundary
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mcp-tier-safety:
    name: MCP live authorization and mutation controls
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Companion test support; full immutable SHA, never a moving branch.
      MCP_BRAIN_SHA: 1a2ca61fd39003f3a72b5cdf4beb39ae5dfe32f7
      MCP_BRAIN_DIR: ${{ github.workspace }}/.mcp-brain
      MCP_EVIDENCE_DIR: ${{ github.workspace }}/.tmp/mcp-tier-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aiosbrain/aios-team-brain
          ref: ${{ env.MCP_BRAIN_SHA }}
          path: .mcp-brain
          persist-credentials: false
      - run: npm ci --ignore-scripts
        working-directory: .mcp-brain
      - run: node test/support/mcp-tier-safety.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mcp-tier-safety-${{ github.sha }}
          path: .tmp/mcp-tier-evidence
          if-no-files-found: error
          retention-days: 30
