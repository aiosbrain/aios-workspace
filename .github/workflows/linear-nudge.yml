name: Linear merge nudge (advisory)

# Reconciliation nudge, not a gate: aios-work-sync.yml already posts a merged work-event to the
# brain, but nothing checks whether the Linear issue the PR referenced actually moved to a
# resolved state. This workflow closes that gap — on every merged PR, extract AIO-<n> ids from
# the title + branch, look up each issue's Linear state, and comment on the PR if any referenced
# issue is still open. Fail-open: if LINEAR_API_KEY isn't configured, or the Linear API errors,
# the job logs and exits 0 — it must never turn a merge red.
#
# Required credential:
#   LINEAR_API_KEY — a Linear personal/API key with read access to the AIO team, held on the
#   `trusted-automation` repository Environment. That environment is a blast-radius control over
#   which workflows may read the key; it is NOT a boundary against forks (under
#   pull_request_target GITHUB_REF is always the base branch, so any author satisfies a
#   `main`-only branch policy). The job-level same-repo guard below is what keeps fork runs away
#   from the credential.
#
# ── Credential isolation (why this is pull_request_target) ───────────────────────────────────
# Under `pull_request` the workflow file is taken from the PR head, so a same-repo branch PR could
# rewrite this file — drop the `merged == true` guard, repoint the checkout at its own tree, print
# the key — and just close its own PR to fire it. `pull_request_target` runs the base branch's
# copy, so the guard, the checkout, and the script path below are all trusted code.
#
# Two things make the checkout below trustworthy rather than merely trusted-looking: the trigger
# is filtered to `branches: [main]` (see the note on it), and the step names no ref at all, so it
# takes the default — the tip of the PR's base branch, which that filter pins to `main`.
# `scripts/linear-merge-nudge.mjs` is therefore always the reviewed copy on the protected default
# branch, never the candidate tree's. PR title and branch reach that script only through `env:`,
# never interpolated into a `run:` body. All actions are pinned by full commit SHA.

on:
  pull_request_target:
    # `branches: [main]` is load-bearing, not tidiness. Without it a PR may target ANY branch,
    # and under pull_request_target the "base" is that branch — so a collaborator could push
    # `evil`, open and merge `evil2 -> evil`, and this job would check out THEIR branch and run
    # THEIR scripts/linear-merge-nudge.mjs with LINEAR_API_KEY. Restricting the trigger to PRs
    # into `main` is what makes the checked-out tree a reviewed, protected-branch commit.
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  nudge:
    name: check referenced Linear issue is resolved
    # Same-repo merged PRs only. Under `pull_request` a fork run received no secrets and this
    # workflow soft-skipped; the guard preserves that behaviour rather than newly exposing the
    # key to runs started by outside contributors.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10 # observed p100 0.2 min
    environment: trusted-automation
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      # Reachable only when the value has not been entered yet. A branch-policy mismatch fails
      # the job outright before any step runs, so this cannot mask a misconfigured environment.
      - name: Skip note
        if: env.LINEAR_API_KEY == ''
        run: echo "LINEAR_API_KEY not configured — skipping Linear merge-nudge."

      # No `ref:` on purpose. Under pull_request_target the default checkout ref is GITHUB_SHA,
      # which is the tip of the PR's BASE branch — and `branches: [main]` above pins that to the
      # protected default branch. So the script run below is always the reviewed copy on `main`,
      # and no `github.event.pull_request.*` expression selects what gets checked out at all.
      # (actions/checkout v7+ additionally refuses to check out fork PR head content under
      # pull_request_target without `allow-unsafe-pr-checkout`, which is not set here.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.LINEAR_API_KEY != ''
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/linear-merge-nudge.mjs
          sparse-checkout-cone-mode: false

      - name: Compute nudge
        if: env.LINEAR_API_KEY != ''
        id: nudge
        run: node scripts/linear-merge-nudge.mjs

      - name: Comment on the PR
        if: env.LINEAR_API_KEY != '' && steps.nudge.outputs.should_comment == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NUDGE_BODY: ${{ steps.nudge.outputs.comment_body }}
        with:
          script: |
            // NUDGE_BODY comes in via env (not interpolated into the script string) so it can't
            // break out of the JS context even if it contained backticks/${} sequences.
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: process.env.NUDGE_BODY,
            });
